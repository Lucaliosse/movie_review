services:
  backend:
    build: ./back_movie_review
    ports:
      - "8000:8000"
    env_file:
      - path: ./back_movie_review/.env
        required: false

  frontend:
    build:
      context: ./front_movie_review
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
